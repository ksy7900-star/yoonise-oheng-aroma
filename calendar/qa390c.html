<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA 390 · 사용법 팝업 확인 (임시)</title>
<style>
  html, body { margin: 0; background: #171614; font: 12px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; color: #eee; }
  #stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; }
  #f { width: 390px; height: 844px; border: 0; display: block; background: #fff; }
  #log { position: fixed; left: 400px; top: 0; width: 420px; max-height: calc(100vh - 50px); overflow: auto; margin: 0; padding: 10px 12px; background: #0d0d0c; color: #a8e6a9; font-size: 11px; white-space: pre-wrap; }
  #acts { position: fixed; left: 400px; bottom: 0; width: 420px; padding: 8px 10px; background: #0d0d0c; display: flex; gap: 6px; flex-wrap: wrap; }
  #acts button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"><iframe id="f" title="calendar 390"></iframe></div>
<pre id="log">loading…</pre>
<div id="acts">
  <button data-act="fresh">① 첫 방문 (기록 지우고 다시 열기)</button>
  <button data-act="revisit">② 재방문 (기록 그대로 다시 열기)</button>
  <button data-act="dump">상태 읽기</button>
</div>
<script>
(function () {
  var F = document.getElementById('f'), LOG = document.getElementById('log');
  var BASE = 'index.html?v=20261121c';
  var KEY_GUIDE = 'yoonise.timing.guide.v1';
  var KEY_IN = 'yoonise.timing.v1', KEY_OLD = 'yoonise.oheng.last.v1';
  var HOOK = '<script>window.__qaErrs=[];' +
    'window.addEventListener("error",function(e){window.__qaErrs.push("ERROR: "+e.message+" @"+(e.filename||"")+":"+(e.lineno||0))});' +
    'window.addEventListener("unhandledrejection",function(e){window.__qaErrs.push("REJECT: "+((e.reason&&e.reason.message)||e.reason))});' +
    '(function(){var ce=console.error;console.error=function(){window.__qaErrs.push("console.error: "+Array.prototype.join.call(arguments," "));ce.apply(console,arguments)};' +
    'var cw=console.warn;console.warn=function(){window.__qaErrs.push("console.warn: "+Array.prototype.join.call(arguments," "));cw.apply(console,arguments)}})();<\/script>';

  function w() { return F.contentWindow; }
  function log(s) { LOG.textContent = s; }
  function safe(f) { try { return f(); } catch (e) { return 'n/a'; } }
  function round(r) { return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; }
  function isVisible(el) { var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }

  function dump(tag) {
    var win = w();
    var g = win.document.getElementById('guideModal');
    var gd = win.document.getElementById('guideDialog');
    var help = win.document.getElementById('calHelp');
    var list = win.__qaErrs || [];
    log(
      '[' + (tag || '-') + '] ' + new Date().toLocaleTimeString() + '\n' +
      'guide flag     : ' + safe(function () { return win.localStorage.getItem(KEY_GUIDE); }) + '\n' +
      'guide hidden   : ' + (g ? g.hidden : 'no element') + '\n' +
      'guide visible  : ' + (g && !g.hidden && gd ? isVisible(gd) : false) + '\n' +
      'dialog box     : ' + (g && gd ? JSON.stringify(round(gd.getBoundingClientRect())) : '-') + '\n' +
      'calHelp box    : ' + (help ? JSON.stringify(round(help.getBoundingClientRect())) : '-') + '\n' +
      'body modal-open: ' + win.document.body.classList.contains('is-modal-open') + '\n' +
      'result shown   : ' + !win.document.getElementById('result').hidden + '\n' +
      '--- console (' + list.length + ') ---\n' + (list.length ? list.join('\n') : '(없음)')
    );
  }

  async function load(fresh) {
    if (fresh) {
      try {
        localStorage.removeItem(KEY_GUIDE);
        localStorage.removeItem(KEY_IN);
        localStorage.removeItem(KEY_OLD);
      } catch (e) {}
    }
    var res = await fetch(BASE + '&r=' + Date.now(), { cache: 'no-store' });
    var html = await res.text();
    var base = new URL(BASE, location.href).href.replace(/[^/]*$/, '');
    html = html.replace(/\b(src|href)="(?!https?:|data:|\/|#)([^"]+)"/g, function (m, a, b) { return a + '="' + base + b + '"'; });
    html = html.replace('</head>', HOOK + '</head>');
    F.onload = function () { setTimeout(function () { dump(fresh ? 'fresh load' : 'reload'); }, 1300); };
    F.srcdoc = html;
  }

  document.getElementById('acts').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'fresh') load(true);
    else if (a === 'revisit') load(false);
    else dump('manual');
  });

  load(true);
  setInterval(function () { safe(dump); }, 4000);
})();
</script>
</body>
</html>
