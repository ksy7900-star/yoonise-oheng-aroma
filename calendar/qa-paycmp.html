<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QA</title>
<!-- 임시 검증 화면 (2026-11-28) — 390×844 폰 폭에서 결제 창 두 상태를 눈으로 확인하려고 잠깐 올린다.
     확인이 끝나면 이 파일은 지운다. ?state=live|over|reset -->
<style>
  html,body{margin:0;padding:0;background:#3a352d}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;margin:0 auto}
</style>
</head>
<body>
<iframe id="cal" title="calendar"></iframe>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || 'live';
  var v = q.get('v') || '20261128m';

  /* 이 기기에 남은 앱 기록을 모두 지운다 — '새 손님' 상태에서 시작해야 두 상태를 섞이지 않고 본다 */
  var wipe = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf('yoonise.') === 0) wipe.push(k);
  }
  wipe.forEach(function (key) { localStorage.removeItem(key); });
  try { localStorage.setItem('yoonise.timing.welcome.v1', '1'); } catch (e) { }   // 첫 방문 · 사용법 팝업은 접어 둔다
  try { localStorage.setItem('yoonise.timing.guide.v1', '1'); } catch (e) { }

  var base = {
    name: '테스트', gender: 'F', calendar: 'solar',
    y: 1990, m: 5, d: 19, leap: false, timeKnown: true, hh: 8, mm: 30,
    region: 'seoul', trueSolar: false, dst: false, ziRule: '23'
  };
  function saved(s) {
    var o = {};
    for (var key in base) o[key] = base[key];
    o.savedAt = s;
    return JSON.stringify(o);
  }

  if (state === 'over') {
    /* 이벤트 시작(2026-11-24 09:00) 전에 사주를 넣어 둔 기기 = 72시간 경과 화면 */
    localStorage.setItem('yoonise.timing.v1', saved('2026-11-20T10:00:00+09:00'));
  } else if (state === 'live') {
    /* 오늘 사주를 넣은 새 기기 = 72시간 이내 화면 (서버가 first_saju_at 을 지금으로 남긴다) */
    localStorage.setItem('yoonise.timing.v1', saved(new Date().toISOString()));
    localStorage.setItem('yoonise.timing.trialStart.v1', new Date().toISOString().slice(0, 10));
  } else {
    document.getElementById('cal').hidden = true;
    return;
  }

  var f = document.getElementById('cal');
  f.addEventListener('load', function () {
    setTimeout(function () {
      try { f.contentWindow.YoonCalendar.openShop('pass'); } catch (e) { }
    }, 1200);
  });
  f.src = './?v=' + encodeURIComponent(v);
})();
</script>
</body>
</html>
